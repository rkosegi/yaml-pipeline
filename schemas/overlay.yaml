---
# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/refs/heads/main/schemas/v1.0/schema.yaml
overlay: 1.0.0
info:
  title: Overlay
  version: 0.0.0
actions:
  - target: $.components.schemas.callOpSpec
    update:
      properties:
        argsFrom:
          x-go-type: ValOrRef
  - target: $.components.schemas.envOpSpec
    update:
      properties:
        exclude:
          x-go-type: regexp.Regexp
        include:
          x-go-type: regexp.Regexp
  - target: $.components.schemas.execOpSpec
    update:
      properties:
        stderr:
          x-go-type: StreamDestination
        stdout:
          x-go-type: StreamDestination
  - target: $.components.schemas.exportOpSpec
    update:
      properties:
        file:
          x-go-type: '*ValOrRef'
        path:
          x-go-type: ValOrRef
  - target: $.components.schemas.forEachOpSpec
    update:
      properties:
        glob:
          x-go-type: ValOrRef
        item:
          x-go-type: ValOrRefSlice
        query:
          x-go-type: ValOrRef
  - target: $.components.schemas.html2DomOpSpec
    update:
      properties:
        query:
          x-go-type: ValOrRef
  - target: $.components.schemas.httpOpSpec
    update:
      properties:
        storeTo:
          x-go-type: ValOrRef
  - target: $.components.schemas.osFileMode
    update:
      x-go-type: os.FileMode
  - target: $.components.schemas.osFilePath
    update:
      x-go-type: '*ValOrRef'
  - target: $.components.schemas.patchOpSpec
    update:
      properties:
        op:
          x-go-type: patch.Op
        value:
          x-go-type: AnyVal
  - target: $.components.schemas.sourceOfData
    update:
      properties:
        file:
          x-go-type: ValOrRef
        tree:
          x-go-type: ValOrRef
  - target: $.components.schemas.storeResultTo
    update:
      x-go-type: '*ValOrRef'
  - target: $.components.schemas.switchOpSpec
    update:
      properties:
        cases:
          x-go-type: ChildActions
        expr:
          x-go-type: ValOrRef
  - target: $.components.schemas.templateOpSpec
    update:
      properties:
        path:
          x-go-type: '*ValOrRef'
        template:
          x-go-type: ValOrRef
  - target: $.components.schemas.xmlImportOptions
    update:
      properties:
        query:
          x-go-type: ValOrRef
