---
# yaml-language-server: $schema=https://raw.githubusercontent.com/rkosegi/yaml-pipeline/refs/heads/main/schemas/pipeline.json?5
lifecycle:
  onComplete:
    steps:
      1-log:
        order: 1
        log:
          message: onComplete
      2-export:
        order: 2
        export:
          file: '{{ .vars.debugDir }}/debug-complete.yaml'
          format: yaml
  onFailure:
    steps:
      1-log:
        order: 1
        log:
          message: onFailure
      2-export:
        order: 2
        export:
          file: '{{ .vars.debugDir }}/debug-failure.yaml'
          format: yaml
  onSuccess:
    steps:
      1-log:
        order: 1
        log:
          message: onSuccess
      2-export:
        order: 2
        export:
          file: '{{ .vars.debugDir }}/debug-success.yaml'
          format: yaml

vars:
  debugDir: .cache
  fail: "false"
steps:
  01-abort:
    abort:
      message: ABORT
    when: '{{ .vars.fail }}'
