---
# yaml-language-server: $schema=../schemas/pipeline.json
vars:
  id: 439098337
  key: abcd123
  case: native
  myfile: examples.md
switch:
  cases:
    native:
      steps:
        1-prepare-body:
          order: 1
          template:
            template: |
              {{- $out := dict "id" .vars.id "key" .vars.key }}
              {{ $out | toJson }}
            parseAs: yaml
            path: input.libEntryPatch
        2-patch:
          order: 2
          http:
            bodyFrom:
              tree: '{{ .input.libEntryPatch | toJson }}'
            url: http://127.0.0.1:8443/api/v1/my-method
    form:
      http:
        url: http://127.0.0.1:8443/api/v1/my-method
        method: POST
        form:
          my-file:
            file: '{{ .vars.myfile }}'
          desc:
            tree: TEST

  expr: '{{ .vars.case }}'
